; Epic's Unreal MCP server (ModelContextProtocol plugin). These are shared project defaults with
; nothing private in them (a loopback port and a URL path). The server does NOT auto start for
; everyone who opens the project: tools/ue/editor.ps1 starts it explicitly with
; -ModelContextProtocolStartServer. To have it start whenever you open the editor, turn on
; Editor Preferences, Plugins, Model Context Protocol, Auto Start Server; that writes
; bAutoStartServer=True to Game/Saved/Config/WindowsEditor/EditorPerProjectUserSettings.ini
; (per user, gitignored, never committed).
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
bAutoStartServer=False
ServerPortNumber=8000
ServerUrlPath=/mcp
