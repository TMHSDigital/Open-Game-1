; AllToolsets enables the GameFeatures plugin, which logs an error at startup unless the Asset Manager
; knows the GameFeatureData type. This is the entry the editor's own fix-up adds.
; /Game/Unused does not exist on purpose: there are no game feature plugins, so there is nothing to scan.
; GameFeatures is also enabled for every target in CombatSimulator.uproject: without it the packaged
; game cannot load the GameFeatureData class this entry names and hits an ensure at startup.
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

[/Script/UnrealEd.ProjectPackagingSettings]
; Cook only listed maps, so test or scratch maps added later do not ship by accident.
+MapsToCook=(FilePath="/Game/Maps/L_CaptureStage")
