[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=7FDA952089BE40D4B09B913F63154DA4
ProjectName=CombatSimulator
ProjectVersion=0.1.14

; AllToolsets (editor only) enables the GameFeatures plugin, which logs an error at startup unless the
; Asset Manager knows the GameFeatureData type. This is the entry the editor's own fix-up adds.
; /Game/Unused does not exist on purpose: there are no game feature plugins, so there is nothing to scan.
; The game uses no game features, so GameFeatures is enabled for the editor only (CombatSimulator.uproject)
; and this entry is editor only (bIsEditorOnly=True): the packaged game neither loads the plugin nor
; looks for its class. Checked with a Shipping package and release gate 11 (the packaged game starts).
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="GameFeatureData",AssetBaseClass="/Script/GameFeatures.GameFeatureData",bHasBlueprintClasses=False,bIsEditorOnly=True,Directories=((Path="/Game/Unused")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=AlwaysCook))

[/Script/UnrealEd.ProjectPackagingSettings]
; Cook only listed maps, so test or scratch maps added later do not ship by accident.
+MapsToCook=(FilePath="/Game/Maps/L_Plane")
; The movement gym ships too (decision 0013 in docs/decisions): F2 switches to it when bDevTools is on.
+MapsToCook=(FilePath="/Game/Maps/L_MovementGym")
; L_CaptureStage is not cooked: captures run the editor on uncooked content (tools/ue/capture.ps1),
; and no player could reach it (F2 cycles DevSwitchMaps only, and Shipping has no console).
; Always cook the Enhanced Input assets: ACSCharacter loads them through the
; soft references below (nothing else references them).
+DirectoriesToAlwaysCook=(Path="/Game/Input")
; The base character's mesh and animation Blueprint are also config soft references
; (CharacterMesh, CharacterAnimClass below); their clips follow as dependencies.
+DirectoriesToAlwaysCook=(Path="/Game/Characters/Base")
; The dev ball (ACSHitBall) is only ever spawned from code and uses the engine's sphere; nothing in a
; map references that mesh, so the cooker would leave it out and the ball would have no shape.
+DirectoriesToAlwaysCook=(Path="/Engine/BasicShapes")

; The default game mode gives the player's character the game's tuning asset (cooked with
; /Game/Characters/Base above), so F5 and cs.Tuning.Reload re-read DA_MovementTuning in play.
[/Script/CombatSimulator.CSGameMode]
CharacterTuning=/Game/Characters/Base/DA_MovementTuning.DA_MovementTuning
; F2 (a dev key, gated by bDevTools) opens the next map in this list. Each must be in MapsToCook above.
+DevSwitchMaps=/Game/Maps/L_Plane
+DevSwitchMaps=/Game/Maps/L_MovementGym
; Maps a run can happen on, in the order the Run tab offers them. Each must be in MapsToCook above.
+RunMaps=/Game/Maps/L_Plane
+RunMaps=/Game/Maps/L_MovementGym
; A player's character below this height (cm; the plane is at 0) respawns at a PlayerStart.
RespawnKillZ=-5000

; The pause key (Escape, Tab, gamepad Start) of the game's player controller.
[/Script/CombatSimulator.CSPlayerController]
PauseAction=/Game/Input/IA_Pause.IA_Pause

