[EditoronlyBP]
bAllowClassAndBlueprintPinMatching=true
bReplaceBlueprintWithClass= true
bDontLoadBlueprintOutsideEditor= true
bBlueprintIsNotBlueprintType= true

[CookSettings]
; Incremental cook: reuse previously cooked packages whose dependencies have not changed.
; Cuts packaging time; pass -forcerecook to BuildCookRun for a full recook when in doubt.
CookIncrementalDefaultIncremental=true
