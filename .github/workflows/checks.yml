name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # No LFS content (saves LFS bandwidth): the pre-commit hook already scanned the verified
          # LFS content, so CI accepts LFS pointers with --lfs-pointers-ok.
          lfs: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10
      - name: Tests
        run: uv run --project tools pytest tools/tests -q
      - name: Secrets scan (all tracked files)
        run: uv run --project tools python -m og secrets --tracked --lfs-pointers-ok
      - name: Asset license check
        run: uv run --project tools python -m og assets check
      - name: Decisions consistency
        run: uv run --project tools python -m og decisions check --offline
