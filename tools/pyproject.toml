[project]
name = "og"
version = "0.1.0"
description = "Open-Game repo tooling: secrets scan, assets, decisions, sessions, site"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "markdown-it-py>=3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["og"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The slow tests (headless Blender, a 4K image) take most of the run. Fast loop:
#   uv run --project tools pytest tools/tests -q -m "not slow"
markers = ["slow: needs Blender or takes seconds (deselect with -m \"not slow\")"]
