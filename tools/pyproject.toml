[project]
name = "og"
version = "0.1.0"
description = "Open-Game repo tooling: secrets scan, assets, decisions, sessions, site"
requires-python = ">=3.11"
dependencies = ["Pillow>=10", "markdown-it-py>=3"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["og"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
